<svg xmlns="http://www.w3.org/2000/svg" width="700" height="250" viewBox="0 0 700 250" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  text{font-family:'Fira Code','Courier New',monospace;fill:#c9d1d9;font-size:14px}
  .t{font-size:17px;font-weight:bold;fill:#a78bfa}
  .s{font-size:11px;fill:#8b949e}
  .tr{fill:#21262d}
  .f{transform-box:fill-box;transform-origin:left;animation:fi 5s ease-in-out infinite}
  @keyframes fi{0%{transform:scaleX(0)}35%{transform:scaleX(1)}90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
</style>
<rect width="700" height="250" rx="14" fill="#0d1117" stroke="#30363d"/>
<text class="t" x="24" y="32">Developer Stats</text>
<text class="s" x="170" y="32">(100% scientifically inaccurate)</text>

<text x="24" y="70">Coffee consumed</text>
<rect class="tr" x="320" y="58" width="250" height="14" rx="7"/>
<rect class="f" x="320" y="58" width="250" height="14" rx="7" fill="#f97316"/>
<text x="585" y="70">inf cups</text>

<text x="24" y="104">Bugs created</text>
<rect class="tr" x="320" y="92" width="250" height="14" rx="7"/>
<rect class="f" x="320" y="92" width="238" height="14" rx="7" fill="#ef4444" style="animation-delay:.2s"/>
<text x="585" y="104">a lot</text>

<text x="24" y="138">Bugs fixed</text>
<rect class="tr" x="320" y="126" width="250" height="14" rx="7"/>
<rect class="f" x="320" y="126" width="150" height="14" rx="7" fill="#22c55e" style="animation-delay:.4s"/>
<text x="585" y="138">some</text>

<text x="24" y="172">StackOverflow tabs open</text>
<rect class="tr" x="320" y="160" width="250" height="14" rx="7"/>
<rect class="f" x="320" y="160" width="212" height="14" rx="7" fill="#67e8f9" style="animation-delay:.6s"/>
<text x="585" y="172">47</text>

<text x="24" y="206">"Works on my machine"</text>
<rect class="tr" x="320" y="194" width="250" height="14" rx="7"/>
<rect class="f" x="320" y="194" width="250" height="14" rx="7" fill="#a78bfa" style="animation-delay:.8s"/>
<text x="585" y="206">42 times</text>

<text class="s" x="24" y="236">* Hiring managers: the stats above are a joke. The skills are not.</text>
</svg>
