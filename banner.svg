    <rect x="0" y="158" width="16" height="16" fill="#ffd23f" stroke="#c98a00" stroke-width="2"><animate attributeName="x" values="0;4;7;4;0" dur="0.8s" repeatCount="indefinite"/><animate attributeName="width" values="16;8;2;8;16" dur="0.8s" repeatCount="indefinite"/></rect>
<rect x="44" y="146" width="16" height="16" fill="#ffd23f" stroke="#c98a00" stroke-width="2"><animate attributeName="x" values="44;48;51;48;44" dur="0.8s" repeatCount="indefinite"/><animate attributeName="width" values="16;8;2;8;16" dur="0.8s" repeatCount="indefinite"/></rect>
<rect x="88" y="158" width="16" height="16" fill="#ffd23f" stroke="#c98a00" stroke-width="2"><animate attributeName="x" values="88;92;95;92;88" dur="0.8s" repeatCount="indefinite"/><animate attributeName="width" values="16;8;2;8;16" dur="0.8s" repeatCount="indefinite"/></rect>

