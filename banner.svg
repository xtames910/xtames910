<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f0c29"/><stop offset=".5" stop-color="#302b63"/><stop offset="1" stop-color="#1b1b3a"/>
  </linearGradient>
  <linearGradient id="ttl" x1="0" x2="1">
    <stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#67e8f9"/>
  </linearGradient>
</defs>
<style>
  text{font-family:'Fira Code','Courier New',monospace}
  .fl{fill:#a78bfa;opacity:.4;font-size:16px;animation:fl 6s ease-in-out infinite}
  @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  .bar{fill:#67e8f9;opacity:.5;transform-box:fill-box;transform-origin:bottom;animation:gr 2.6s ease-in-out infinite alternate}
  @keyframes gr{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
  .ln{opacity:0;fill:#e9d5ff;font-size:19px;animation:cy 16s infinite}
  @keyframes cy{0%{opacity:0}3%{opacity:1}22%{opacity:1}25%{opacity:0}100%{opacity:0}}
  .cur{fill:#67e8f9;animation:bl 1s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
</style>
<rect width="900" height="260" rx="18" fill="url(#bg)"/>

<text class="fl" x="40"  y="60"  style="animation-delay:0s">SELECT *</text>
<text class="fl" x="120" y="215" style="animation-delay:1s">df.head()</text>
<text class="fl" x="250" y="40"  style="animation-delay:2s">p &lt; 0.05</text>
<text class="fl" x="60"  y="150" style="animation-delay:3s">NaN</text>
<text class="fl" x="640" y="45"  style="animation-delay:1.5s">404</text>
<text class="fl" x="330" y="235" style="animation-delay:2.5s">import pandas</text>
<text class="fl" x="560" y="225" style="animation-delay:.5s">{ }</text>

<rect class="bar" x="730" y="150" width="18" height="80" style="animation-delay:0s"/>
<rect class="bar" x="758" y="120" width="18" height="110" style="animation-delay:.4s"/>
<rect class="bar" x="786" y="165" width="18" height="65" style="animation-delay:.8s"/>
<rect class="bar" x="814" y="95"  width="18" height="135" style="animation-delay:1.2s"/>
<rect class="bar" x="842" y="135" width="18" height="95" style="animation-delay:1.6s"/>

<text x="440" y="118" text-anchor="middle" font-size="76" font-weight="bold" fill="url(#ttl)">cangu</text>
<rect class="cur" x="567" y="66" width="7" height="58"/>

<text class="ln" x="440" y="170" text-anchor="middle" style="animation-delay:0s">Business Data Analytics student</text>
<text class="ln" x="440" y="170" text-anchor="middle" style="animation-delay:4s">I turn messy CSVs into slightly less messy insights</text>
<text class="ln" x="440" y="170" text-anchor="middle" style="animation-delay:8s">Trust me, I'm a data analyst (p &lt; 0.05)</text>
<text class="ln" x="440" y="170" text-anchor="middle" style="animation-delay:12s">It works on my Jupyter notebook (TM)</text>
</svg>
