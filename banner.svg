      <rect x="6" y="36" width="36" height="6" fill="#ff5fa2"/>
      <rect x="12" y="42" width="24" height="6" fill="#ff5fa2"/>
      <rect x="0" y="36" width="6" height="12" fill="#ffd1a4"/>
      <rect x="42" y="36" width="6" height="12" fill="#ffd1a4"/>
      <!-- pants + legs -->
      <rect x="12" y="48" width="24" height="6" fill="#3b4cca"/>
      <rect y="54" width="12" height="6" fill="#2a2a3a">
        <animate attributeName="x" values="12;6;12;18" calcMode="discrete" dur="0.6s" repeatCount="indefinite"/></rect>
      <rect y="54" width="12" height="6" fill="#2a2a3a">
        <animate attributeName="x" values="24;30;24;18" calcMode="discrete" dur="0.6s" repeatCount="indefinite"/></rect>
