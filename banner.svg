      <rect x="18" y="18" width="4" height="6" fill="#1a1a1a"/>
      <rect x="28" y="18" width="4" height="6" fill="#1a1a1a"/>
      <rect x="14" y="24" width="4" height="4" fill="#ff9ab8"/>
      <rect x="32" y="24" width="4" height="4" fill="#ff9ab8"/>
      <!-- body -->
