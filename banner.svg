      <!-- hair -->
      <rect x="12" y="0" width="24" height="6" fill="#3b2418"/>
      <rect x="6" y="6" width="36" height="6" fill="#3b2418"/>
      <rect x="36" y="6" width="6" height="6" fill="#ff5fa2"/>
      <rect x="6" y="12" width="6" height="18" fill="#3b2418"/>
      <rect x="36" y="12" width="6" height="18" fill="#3b2418"/>
      <!-- face -->
