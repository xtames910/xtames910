    <text x="453" y="103" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-weight="bold" font-size="46" letter-spacing="4" fill="#ff5fa2">LAN PHƯƠNG</text>
    <text x="450" y="100" text-anchor="middle" font-family="'Courier New',Courier,monospace" font-weight="bold" font-size="46" letter-spacing="4" fill="#ffffff">LAN PHƯƠNG</text>
